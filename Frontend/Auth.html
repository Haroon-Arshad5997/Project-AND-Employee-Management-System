<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Please Wait</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        :root {
            --bg-main: #0F172A;
            --bg-secondary: #1E293B;

            --primary: #2563EB;
            --primary-hover: #3B82F6;
            --accent: #14B8A6;

            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;

            --border: #334155;

            --success: #22C55E;
            --error: #EF4444;
        }

        *{
            color: var(--text-main);
            font-family: Inter;
            padding: 0;
            margin: 0;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            min-height: 100vh;
        }

        .Loading-PG{
            position: fixed;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-secondary);
            font-weight: 200;
            letter-spacing: 3px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .loader {
            width: 90px;
            height: 14px;
            --c:#ffffff 92%,#ffffff00;
            background: 
                radial-gradient(circle 7px at bottom,var(--c)) 0 0,
                radial-gradient(circle 7px at top   ,var(--c)) 0 100%;
            background-size: calc(100%/4) 50%;
            background-repeat: repeat-x;
            animation: l11 1s infinite;
        }

        .Loading-PG.hide{
            opacity: 0;
            visibility: hidden;
        }

        .Logo-section{
            display: flex;
            flex-direction: row;
            align-items: center;
            letter-spacing: 2px;
            line-height: 10px;

            h4{
                font-size: 600;
            }
        }

        .Logform{
            background: linear-gradient(45deg ,var(--bg-secondary), var(--bg-main));
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 40vw;
            padding: 40px;
        }

        #FormSection{
            margin-top: 40px;

            section{
                margin-top: 20px;
                margin-bottom: 20px;
                background-color: var(--bg-main);
                padding-top: 0px;
                padding-bottom: 0px;
                padding-left: 10px;
                padding-right: 0px;
                width: 100%;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 20px;
                border-radius: 10px;
                border: 1px solid var(--border);
                transition: 0.2s ease-in-out;
                overflow: hidden;
            }

            section:focus-within{
                transform: translateY(-2px);
                box-shadow: 4px 4px 10px #ffffff77;
            }

            input{
                width: 100%;
                padding: 20px;
                background-color: transparent;
                border: 0px;
                outline: none;
            }
        }

        .SocialBtn{
            display: flex;
            flex-direction: row;
            gap: 10px;

            button{
                padding: 10px;
            }
        }

        button[type="submit"]{
            background: linear-gradient(-270deg , var(--primary), rgb(93, 182, 255));
            border-radius: 10px;
            width: 100%;
            padding: 20px;
            display: flex;
            border: none;
            justify-content: center;
        }

        @keyframes l11 {
            80%,100% {background-position: calc(100%/3) 0,calc(100%/-3) 100%}
        }
    </style>

    <!-- Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>

    <div class="Loading-PG" id="LoadingScreen">
        <h3>Please Wait!</h3>
        <div class="loader"></div>
    </div>
    <!-- logo -->
     <header class="Logo-section">
         <img src="Pics/Logo.png" width="100rem" height="100rem">
         <section>
             <h4><b>SyncBoard</b></h4>
             <sub>Comunicate Better, Manage Faster!</sub>
         </section>
     </header>
    
    <main class="container-fluid d-flex flex-row p-0">
        <!-- Left Side -->
        <aside class="col-6">


        </aside>

        <!-- Right Side -->
        <aside class="col-6 p-3 d-flex justify-content-center">
            <!-- Form -->
            <div class="Logform">

                <section>
                    <h1>Login</h1>
                    <p style="font-weight: 300;">Enter your details to continue</p>
                    <sub id="eError"></sub>
                </section>

                <form id="FormSection">
                    <!-- Input Section 1 -->
                    <section>
                        <label for="Email"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480v58q0 59-40.5 100.5T740-280q-35 0-66-15t-52-43q-29 29-65.5 43.5T480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480v58q0 26 17 44t43 18q26 0 43-18t17-44v-58q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93h200v80H480Zm85-315q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Z"/></svg> </label>
                        <input type="text" placeholder="Enter Email Address" id="Email"/>
                        <caption id="EmailError"></caption>
                    </section>
                    <!-- Input Section 2 -->
                    <section>
                        <label for="Pwd"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M223.5-423.5Q200-447 200-480t23.5-56.5Q247-560 280-560t56.5 23.5Q360-513 360-480t-23.5 56.5Q313-400 280-400t-56.5-23.5ZM280-240q-100 0-170-70T40-480q0-100 70-170t170-70q67 0 121.5 33t86.5 87h352l120 120-180 180-80-60-80 60-85-60h-47q-32 54-86.5 87T280-240Zm0-80q56 0 98.5-34t56.5-86h125l58 41 82-61 71 55 75-75-40-40H435q-14-52-56.5-86T280-640q-66 0-113 47t-47 113q0 66 47 113t113 47Z"/></svg> </label>
                        <input type="text" placeholder="Enter Password" id="Pwd"/>
                        <caption id="pwdEmail"></caption>
                    </section>

                    <div style="display: flex; flex-direction: row; justify-content: space-between;">
                        <div class="d-flex flex-row">
                            <label for="RemeberMe"><input type="checkbox"/></label>
                            <p id="RemeberMe">&ensp;Remember Me</p>
                        </div>

                        <a href="#" style="text-decoration: none; color: var(--accent);">Forget Password &rtrif;</a>
                    </div>

                    <button type="submit">Login&ensp;<b>&roarr;</b></button>

                    <hr>
                    
                    <div class="SocialBtn">
                        <button class="btn btn-secondary col-6"> <svg role="img" width="20px" viewBox="0 0 24 24" fill="#e3e3e3" xmlns="http://www.w3.org/2000/svg"><title>Google</title><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>&ensp; Login By Google</button>
                        <button class="btn btn-secondary col-6"> <svg role="img" width="20px" viewBox="0 0 24 24" fill="#e3e3e3" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg> Login By Github</button>
                    </div>
                </form>

            </div>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>




    <script>

        const LoadingScreen = document.getElementById('LoadingScreen');

        window.addEventListener('load', () => {
            document.querySelector('title').innerHTML = "Verify Yourself!"
            LoadingScreen.style.display = 'none';
            LoadingScreen.classList.add('hide');
        });

        
    </script>
  </body>
</html>
