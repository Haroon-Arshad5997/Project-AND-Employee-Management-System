<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="Pics/Logo.png">
    <title>Welcome to the Lobby!</title>

    <style>
        :root {
            --bg-main: #0F172A;
            --bg-secondary: #1E293B;

            --primary: #2563EB;
            --primary-hover: #3B82F6;
            --accent: #14B8A6;

            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;

            --border: #334155;

            --success: #22C55E;
            --error: #EF4444;
        }

        *{
            font-family: Inter !important;
            padding: 0;
            margin: 0;
            user-select: none;
        }

        body{
            user-select: none;
            background: linear-gradient(var(--bg-main), var(--bg-secondary));
            color: var(--text-main) !important;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100dvh;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 6rem 1fr;
            grid-template-areas: "Navbar Navbar Navbar Navbar Navbar Navbar" "Sidebar ContentSection ContentSection ContentSection ContentSection ContentSection";
        }

        .Navbar{
            border-bottom: 1px solid var(--primary-hover);
            color: var(--text-main) !important;
            background-color: var(--bg-main);
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            grid-area: Navbar;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .Sidebar{
            grid-area: Sidebar;
            color: var(--text-main) !important;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 5px;
            padding-right: 5px;
            background-color: var(--bg-main);
            box-shadow: 2px 0px 2px var(--primary-hover);
            border-bottom-right-radius: 20px;

            button{
                width: 100%;
                background-color: transparent;
                border-radius: 6px;
                color: var(--text-main);
                fill: var(--text-secondary);
                border: 0px;
                padding: 15px;
                margin: 2px;
                transition: 0.3s ease-in-out;
                outline: none;

                section{
                    display: flex;
                    gap: 10px;
                    padding-left: 10px;
                    padding-right: 10px;
                    align-items: center;
                }
            }

            button:hover, button:focus{
                background-color: var(--primary);
                fill: var(--primary-hover);
                color: var(--text-secondary);
            }
        }

        .Content-Section{
            grid-area: ContentSection;
            color: var(--text-main) !important;
            padding: 20px;
        }

        .ver-line{
            background-color: var(--primary-hover);
            color: var(--text-main) !important;
            width: 1px;
            height: 85px;
        }

        .Logo-Section{
            color: var(--text-main) !important;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        #ProfileModal{
            background-color: var(--bg-main);
            border: 1px solid var(--accent);
            border-radius: 20px;
            width: 90dvw;
            height: 90dvh;
            color: var(--text-main);
            align-self: center;
            justify-self: center;
            padding: 20px;

            header{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            button{
                background-color: transparent;
                border: 0px;
                color: var(--text-main);
                fill: var(--text-main);
                transition: 0.5s ease-in-out;
            }

            button:hover{
                transform: rotate(360deg);
            }
        }

        #ProfileModal:open{
            animation: FadeIn 0.5s ease-in;
        }

        #ProfileModal:open::backdrop{
            background-color: rgba(0, 0, 0, 0.66);
        }

        .ModalProfileimg{
            border-radius: 100%;
            width: 20dvw;
            border: 5px solid var(--accent);
        }

        .Profile-Section{
            button{
                 color: var(--text-main) !important;
                padding: 10px;
                background-color: transparent;
                border: 0px;
                display: flex;
                flex-direction: row;
                gap: 20px;
                align-items: center;

                section{
                    text-align: left;
                    line-height: 1px;
                }
            }

            img{
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 100%;
            }
        }

        @keyframes FadeIn {
            from{opacity: 0; transform: translateY(-20px);}
            to{opacity: 1; transform: translateX(0px);}
        }

        @media (max-width: 769px) {
            .Logo-Section{

                line-height: 1px;
                img{
                    width: 80px;
                    height: 80px;
                } 
                sub{
                    font-size: 10px;
                }
            }

            .Sidebar{
                font-size: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-left: 1px;
                padding-right: 1px;

                button{
                    width: max-content;

                    section{
                        gap: 0;
                    }
                }
            }

            .Profile-Section{
                section{
                    display: none;
                }
            }
        }
    </style>

            <section>

    <script>
        const ActivePointer = document.getElementById('ActivePointer');

        const UserName = document.getElementsByClassName('UserName');
        const UserStatus = document.getElementsByClassName('UserStatus');

        [UserName[0], UserName[1]].forEach(e => {
            e.innerText = 'Haroon Arshad';
        });

        [UserStatus[0], UserStatus[1]].forEach(e => {
            e.innerText = 'Sleeping'
        })

        ActivePointer.style.color = 'red';
        ActivePointer.style.color = UserStatus[1].innerText.toLowerCase() === 'active' ? "green" : "red";
    </script>
